    <style>html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:rgba(15,118,110,.2)}button,a{transition:transform .1s ease,opacity .1s ease,background-color .12s ease}button:not(:disabled):active{transform:scale(.96);opacity:.8}</style>

    <!-- Tailwind via CDN for prototype speed. For production, install Tailwind

    <script>
      // 'class' strategy lets us toggle dark mode with a class on <html>
      // instead of only following the OS setting — required for a user-facing
      // Light/Dark/System switch to actually work.
      tailwind.config = { darkMode: 'class' };
